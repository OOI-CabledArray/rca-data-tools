# Generic metadata about this project
name: rca-data-tools
prefect-version: 3.8.8

# build section allows you to manage and build docker images
build:

# push section allows you to manage if and how this project is uploaded to remote locations
push:

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/OOI-CabledArray/rca-data-tools.git
    branch: main

# the deployments section allows you to provide configuration for deploying flows
deployments:
# one deployment; pipeline.py sets cpu/memory per run from params/compute_exceptions.yaml
- name: qaqc
  entrypoint: rca_data_tools/qaqc/flow.py:qaqc_pipeline_flow
  parameters: {}
  work_pool:
    name: scope-push-pool
    job_variables: {cpu: 2048, memory: 16384}

# --- QAQC_dashboard workflow triggers -------------------------------------
# Reliable clock in front of the GitHub Actions
# Condensed to 3 deployments: one per fire-time. The 11:00
# batch carries the day-of-week split (Mon weekly variants, Tue-Fri daily)
# Each only makes a few HTTP dispatch calls, so they request minimal Fargate resources (0.5 vCPU/1GB).
- name: trigger-echo-chain
  tags: [scheduler]
  description: harvest -> wait for zarr write -> echograms
  entrypoint: rca_data_tools/qaqc/scheduler.py:trigger_echo_chain
  parameters: {}
  work_pool:
    name: scope-push-pool
    job_variables: {cpu: 512, memory: 1024}
  schedule: {cron: "0 12 * * *", timezone: UTC}
  is_schedule_active: true
- name: trigger-profile-indices
  tags: [scheduler]
  description: after the profiler CTD harvests (done ~10:33), before the 11:00 plots
  entrypoint: rca_data_tools/qaqc/scheduler.py:trigger_workflow
  parameters: {workflow_file: profile_indices.yaml}
  work_pool:
    name: scope-push-pool
    job_variables: {cpu: 512, memory: 1024}
  schedule: {cron: "45 10 * * *", timezone: UTC}
  is_schedule_active: true
- name: trigger-daily-batch
  tags: [scheduler]
  description: 11:00 UTC hydrophones + weekday-split pipeline/seismometer
  entrypoint: rca_data_tools/qaqc/scheduler.py:trigger_daily_batch
  parameters: {}
  work_pool:
    name: scope-push-pool
    job_variables: {cpu: 512, memory: 1024}
  schedule: {cron: "0 11 * * *", timezone: UTC}
  is_schedule_active: true