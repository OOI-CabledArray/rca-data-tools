[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca_data_tools"
version = "2.1.0"
description = "Utilities for working with Regional Cabled Array Data."
authors = [
  { name = "RCA Data Team", email = "jduprey@uw.edu" },
]
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "bs4",
    "cmislib3",
    "cmocean",
    "dask",
    "fsspec",
    "gspread<5.2",
    "humanfriendly",
    "loguru",
    "matplotlib",
    "netcdf4",
    "numba",
    "numpy>2",
    "pandas>2,<3",
    "pathlib",
    "prefect>=3.8",
    "prefect-aws",
    "requests",
    "s3fs>=2024",
    "scipy",
    "xarray>=2024.1.1,<2026.4",  # 2026.4 dropped zarr 2; we pin zarr<3
    "zarr<3.0.0",
]

[project.scripts]
    generate_hitl_tables = "rca_data_tools.qaqc.notes:main"
    qaqc_pipeline = "rca_data_tools.qaqc.pipeline:main"
    qaqc_index = "rca_data_tools.qaqc.index:main"

[tool.ruff]
line-length = 95

[tool.ruff.lint]
# CI runs pyflakes checks only (undefined names, unused imports/variables):
# they catch real bugs without style churn
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# unpacked instrument record fields are kept to document the data layout
"rca_data_tools/qaqc/advanced_qaqc/calculateFunctions.py" = ["F841"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["tests"]